{{ partial "graph-theme.html" . }}

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-cloud@1/build/d3.layout.cloud.js"></script>

<script>
  (function() {
    let container = document.getElementById("word-cloud");
    if (!container) {
      container = document.createElement("div");
      container.id = "word-cloud";
      // On /blog/ or /tags/<term>/, place the word cloud after the posts list.
      // If there is an existing bottom tag list (content .blog-posts ~ small), replace it.
      const bottomSmall = document.querySelector("content .blog-posts ~ small");
      const postsList = document.querySelector("content .blog-posts");
      if (bottomSmall) {
        bottomSmall.replaceWith(container);
      } else if (postsList) {
        postsList.after(container);
      } else {
        const target = document.querySelector("content") || document.querySelector("main");
        target ? target.appendChild(container) : document.body.appendChild(container);
      }
    }

    // Hugo taxonomy data parsed into JS
    const rawTags = [
      {{ range .Site.Taxonomies.tags.ByCount }}
        { text: "#{{ .Page.Title }}", size: {{ .Count }}, url: "{{ .Page.RelPermalink }}" },
      {{ end }}
    ];

    const width = 600;
    const height = 350;

    // Scale counts (min 1, max 91) to font sizes (14px to 48px) using Math.log
    const fontScale = d3.scaleLog()
      .domain([1, d3.max(rawTags, d => d.size)])
      .range([14, 48]);

    const colors = window.GraphTheme ? window.GraphTheme.getColors() : { TAG: "#2563eb" };

    d3.layout.cloud()
      .size([width, height])
      .words(rawTags)
      .padding(4)
      .rotate(() => (Math.random() > 0.8 ? 90 : 0)) // 20% vertical rotation
      .font("Inter, system-ui, sans-serif")
      .fontSize(d => fontScale(d.size))
      .on("end", draw)
      .start();

    function draw(words) {
      const svg = d3.select("#word-cloud").append("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", `0 0 ${width} ${height}`)
        .style("max-width", "100%")
        .style("height", "auto")
        .append("g")
        .attr("transform", `translate(${width / 2},${height / 2})`);

      svg.selectAll("text")
        .data(words)
        .enter().append("text")
        .style("font-size", d => `${d.size}px`)
        .style("font-family", "Inter, system-ui, sans-serif")
        .style("font-weight", d => d.size > 28 ? "700" : "500")
        .style("fill", colors.TAG)
        .attr("text-anchor", "middle")
        .attr("transform", d => `translate(${d.x}, ${d.y}) rotate(${d.rotate})`)
        .style("cursor", "pointer")
        .text(d => d.text)
        .on("click", (e, d) => window.location.href = d.url);
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        const newTheme = window.GraphTheme ? window.GraphTheme.getColors() : { TAG: "#60a5fa" };
        d3.selectAll("#word-cloud text").style("fill", newTheme.TAG);
    });

  })();
</script>
