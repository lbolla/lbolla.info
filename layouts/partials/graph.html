{{ partial "graph-theme.html" . }}

<div class="graph-wrapper">
    <div class="graph-header">
    </div>
    <div id="link-graph" class="graph-canvas"></div>
</div>

<script src="https://unpkg.com/force-graph"></script>
<script>
    (function () {
        const currentPath = "{{ .RelPermalink }}";
        const container = document.getElementById('link-graph');

        fetch("{{ "index.json" | relURL }}")
            .then(res => res.json())
            .then(data => {
                // --- 2-LEVEL TRAVERSAL (Depth 2 BFS) ---
                const level1 = new Set();
                const level2 = new Set();

                // Pass 1: Find 1st-degree neighbors directly connected to currentPath
                data.links.forEach(link => {
                    const src = typeof link.source === 'object' ? link.source.id : link.source;
                    const tgt = typeof link.target === 'object' ? link.target.id : link.target;
                    if (src === currentPath) level1.add(tgt);
                    if (tgt === currentPath) level1.add(src);
                });

                // Pass 2: Find 2nd-degree neighbors connected to any 1st-degree node
                data.links.forEach(link => {
                    const src = typeof link.source === 'object' ? link.source.id : link.source;
                    const tgt = typeof link.target === 'object' ? link.target.id : link.target;

                    if (level1.has(src)) level2.add(tgt);
                    if (level1.has(tgt)) level2.add(src);
                });

                // Combine current note, 1st-degree, and 2nd-degree nodes
                const allNeighbors = new Set([currentPath, ...level1, ...level2]);

                const localNodes = data.nodes.filter(n => allNeighbors.has(n.id));
                const localLinks = data.links.filter(l => {
                    const src = typeof l.source === 'object' ? l.source.id : l.source;
                    const tgt = typeof l.target === 'object' ? l.target.id : l.target;
                    return allNeighbors.has(src) && allNeighbors.has(tgt);
                });

                if (localNodes.length <= 1) {
                    container.parentElement.style.display = 'none';
                    return;
                }

                const width = container.clientWidth;
                const height = 300; // Slightly taller to accommodate more nodes cleanly

                const Graph = ForceGraph()(container)
                    .width(width)
                    .height(height)
                    .graphData({ nodes: localNodes, links: localLinks })
                    .nodeId('id')
                    .nodeLabel('title')
                    .nodeRelSize(4)

                    .nodeColor(node => {
                        const c = window.GraphTheme.getColors();
                        if (node.id === currentPath) return c.CURRENT;
                        if (node.type === 'tag') return c.TAG;
                        // Distinguish 1st-degree vs 2nd-degree nodes visually
                        return level1.has(node.id) ? c.POST : c.POST_L2;
                    })
                    .linkColor(() => window.GraphTheme.getColors().LINK)
                    .linkWidth(1)
                    .backgroundColor('transparent')
                    .onNodeClick(node => {
                        if (node.id !== currentPath) {
                            window.location.href = node.url;
                        }
                    });

                // Re-render colors seamlessly on OS dark/light switch
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                    Graph.nodeColor(Graph.nodeColor())
                        .linkColor(Graph.linkColor());
                });

            });
    })();
</script>
